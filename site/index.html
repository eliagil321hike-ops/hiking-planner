<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topo3D – מתכנן מסלולים</title>
<script>
  // Show any startup error on screen (owner sends a screenshot instead of opening DevTools).
  function showFatal(msg) {
    var d = document.getElementById('fatal') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'fatal' }));
    d.style.cssText = 'position:fixed;inset:auto 12px 12px 12px;z-index:9;background:#c62828;color:#fff;padding:10px 14px;border-radius:8px;font:13px/1.4 Consolas,monospace;direction:ltr;white-space:pre-wrap';
    d.textContent = (d.textContent ? d.textContent + '\n' : 'שגיאה / Error:\n') + msg;
  }
  addEventListener('error', function (e) { showFatal((e.message || 'script failed to load: ' + (e.target && (e.target.src || e.target.href))) ); }, true);
  addEventListener('unhandledrejection', function (e) { showFatal(String(e.reason && e.reason.message || e.reason)); });
</script>
<!-- Versions pinned to the official MapLibre RTL example (checked 2026-11-01). See DECISIONS D-008. -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<!-- perf review 2026-11-03: open the connections to the map hosts early; the libraries load deferred (in order,
     before app.js, which is a module and therefore runs after them) so the page paints without waiting for them. -->
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://tiles.mapterhorn.com" crossorigin>
<script defer src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script defer src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
<link rel="preload" href="fonts/IBMPlexSansHebrew-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" data-i18n-attr="aria-label:map.label" aria-label="מפה טופוגרפית תלת-ממדית"></div>

<div id="fps" class="chip" aria-live="off" hidden>– fps</div>

<!-- Floating toolbar (D-029, D-038): new route, place search, map style, layers, route options. -->
<div id="toolbar" class="toolbar">
  <div class="brand" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 19 L10 6 L14 13 L16.5 9 L21 19 Z" fill="none" stroke="#258F91" stroke-width="1.9"/><path d="M7 15.5 H17" stroke="#258F91" stroke-width="1.9"/></svg><span>Topo3D</span></div>
  <form id="search" class="search" role="search">
    <input id="search-q" type="search" autocomplete="off" data-i18n-attr="placeholder:search.placeholder;aria-label:search.placeholder" placeholder="חיפוש מקום" aria-label="חיפוש מקום">
    <button class="search-go" type="submit" data-i18n-attr="aria-label:search.go;title:search.go" aria-label="חפש"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <ul id="search-results" class="search-results" hidden></ul>
  </form>
  <span class="tb-spacer"></span>
  <span id="plan-badge" class="plan-badge" hidden data-i18n="route.planning">עריכת מסלול</span>
  <button id="btn-library" class="tool-btn panel-btn" type="button" aria-expanded="false" aria-controls="library" data-i18n-attr="aria-label:lib.title;title:lib.title" aria-label="המסלולים שלי"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5h6l2 2h10v10.5H3z"/><path d="M8 15c2-3 4 1 6-2s2.5-1 3-1.5"/></svg><span data-i18n="lib.title">המסלולים שלי</span><svg class="chev" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  <button id="new-route" class="fab" type="button" data-i18n-attr="aria-label:route.new;title:route.new" aria-label="מסלול חדש" title="מסלול חדש"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg><span data-i18n="route.new">מסלול חדש</span></button>
  <button id="btn-style" class="tool-btn panel-btn" type="button" aria-expanded="false" aria-controls="menu-style" data-i18n-attr="aria-label:menu.style;title:menu.style" aria-label="סגנון מפה"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20V6.5Z M9 4v13.5 M15 6.5V20"/></svg><span data-i18n="menu.style">סגנון מפה</span><svg class="chev" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
</div>

<p id="status" class="status toast" role="status" aria-live="polite" hidden></p>

<!-- My Routes library (D-056): filled by library.js; opened by the library button, closed like the other menus. -->
<section id="library" class="library" hidden data-i18n-attr="aria-label:lib.title" aria-label="המסלולים שלי"></section>
<dialog id="lib-dialog" class="lib-dialog"></dialog>
<div id="cat-chip" class="cat-chip" role="status" aria-live="polite" hidden><span></span><button type="button" data-i18n-attr="aria-label:search.catClear;title:search.catClear" aria-label="נקה">✕</button></div>

<section id="menu-style" class="popover" hidden>
  <header class="popover-head"><strong data-i18n="menu.style">סגנון מפה</strong> <small class="build" title="build">__BUILD__</small></header>
  <div class="style-cards" role="radiogroup" data-i18n-attr="aria-label:bg.group" aria-label="רקע המפה">
    <label class="style-card"><input type="radio" name="base" value="topo" checked><span class="thumb thumb-topo"></span><span data-i18n="bg.topo">טופוגרפי</span></label>
    <label class="style-card"><input type="radio" name="base" value="satellite"><span class="thumb thumb-sat"></span><span data-i18n="bg.satellite">לוויין</span></label>
    <label class="style-card"><input type="radio" name="base" value="hybrid"><span class="thumb thumb-hybrid"></span><span data-i18n="bg.hybrid">היברידי 3D</span></label>
  </div>
  <label class="slider"><span data-i18n="layers.exaggeration">הגבהה</span> <input id="exag" type="range" min="1" max="2" step="0.1" value="1.5" list="exag-marks">
    <datalist id="exag-marks"><option value="1"></option><option value="1.2"></option><option value="1.5"></option><option value="2"></option></datalist> <output id="exag-out">1.5</output></label>
  <p class="hint" data-i18n="layers.exagHint">1.0 = גובה אמיתי. אפשר להגביה כדי לראות הבדלי גובה קטנים.</p>
  <details class="advanced">
      <summary data-i18n="layers.advanced">מתקדם</summary>
      <div id="sat-opts">
        <label class="stack"><span data-i18n="bg.provider">מקור לוויין</span>
          <select id="sat-provider"></select>
        </label>
        <div id="sat-key-row" hidden>
          <label class="stack"><span data-i18n="bg.key">מפתח (נשמר רק בדפדפן הזה)</span>
            <input id="sat-key" type="password" autocomplete="off" spellcheck="false" dir="ltr">
          </label>
          <p class="hint" id="sat-key-help"></p>
          <button id="sat-key-save" class="btn" data-i18n="bg.keySave">שמור מפתח והצג</button>
        </div>
      </div>
    </details>
  <section id="dev-section" hidden>
      <h2>Developer tests (?dev=1)</h2>
      <div class="row">
        <button id="t-encoding" class="btn">Encoding check</button>
        <button id="t-probe" class="btn">DEM max zoom</button>
        <button id="t-perf" class="btn">FPS test</button>
      </div>
      <div class="row">
        <button id="t-features" class="btn">Layer check</button>
        <button id="t-copy" class="btn">Copy results</button>
        <button id="t-style" class="btn">Export style</button>
      </div>
      <div id="test-out" class="test-out" aria-live="polite"></div>
    </section>

</section>

<!-- D-052 (owner): no layers menu. The map always shows hillshade, contours and every map feature; these
     switches stay (hidden) as the single place the fixed choice is defined and applied by layers.js. -->
<section id="menu-layers" class="layer-defaults" hidden aria-hidden="true">
    <section>
      <h2 data-i18n="layers.terrainHeading">שטח</h2>
      <div class="layer-row">
        <label><span class="sw sw-hillshade" aria-hidden="true"></span><span data-i18n="layers.hillshade">הצללה</span>
          <input type="checkbox" class="switch" data-group="hillshade" checked></label>
        <input class="opacity" type="range" min="0.1" max="1" step="0.05" data-opacity="hillshade" value="0.9" data-i18n-attr="aria-label:layers.opacity" aria-label="שקיפות">
      </div>
      <div class="layer-row">
        <label><span class="sw sw-contours" aria-hidden="true"></span><span data-i18n="layers.contours">קווי גובה</span>
          <input type="checkbox" class="switch" data-group="contours" checked></label>
      </div>
      <div class="layer-row">
        <label><span class="sw sw-slope" aria-hidden="true"></span><span data-i18n="layers.slope">זווית שיפוע</span>
          <input type="checkbox" class="switch" data-group="slope"></label>
        <input class="opacity" type="range" min="0.1" max="1" step="0.05" data-opacity="slope" value="0.6" data-i18n-attr="aria-label:layers.opacity" aria-label="שקיפות">
        <div class="legend" data-legend="slope"><i style="background:#f4e254"></i>15°<i style="background:#f29c38"></i>25°<i style="background:#e2462e"></i>30°<i style="background:#9e34aa"></i>35°<i style="background:#3c1c5c"></i>45°</div>
      </div>
      <div class="layer-row">
        <label><span class="sw sw-aspect" aria-hidden="true"></span><span data-i18n="layers.aspect">כיוון מדרון</span>
          <input type="checkbox" class="switch" data-group="aspect"></label>
        <input class="opacity" type="range" min="0.1" max="1" step="0.05" data-opacity="aspect" value="0.5" data-i18n-attr="aria-label:layers.opacity" aria-label="שקיפות">
        <div class="legend" data-legend="aspect"><i style="background:#3462d6"></i><span data-i18n="dir.N">צ</span><i style="background:#4cb246"></i><span data-i18n="dir.E">מז</span><i style="background:#e24a3a"></i><span data-i18n="dir.S">ד</span><i style="background:#aa54c4"></i><span data-i18n="dir.W">מע</span></div>
      </div>
      <div class="layer-row">
        <label><span class="sw sw-relief" aria-hidden="true"></span><span data-i18n="layers.relief">צביעה לפי גובה</span>
          <input type="checkbox" class="switch" data-group="relief"></label>
        <input class="opacity" type="range" min="0.1" max="1" step="0.05" data-opacity="relief" value="0.55" data-i18n-attr="aria-label:layers.opacity" aria-label="שקיפות">
      </div>
    </section>
    <section>
      <h2 data-i18n="layers.featuresHeading">פרטים במפה</h2>
      <div class="layer-row">
        <label><span class="sw sw-trails" aria-hidden="true"></span><span data-i18n="layers.trails">שבילים</span>
          <input type="checkbox" class="switch" data-group="trails" checked></label>
      </div>
      <div class="layer-row">
        <label><span class="sw sw-water" aria-hidden="true"></span><span data-i18n="layers.water">נחלים</span>
          <input type="checkbox" class="switch" data-group="water" checked></label>
      </div>
      <div class="layer-row">
        <label><span class="sw sw-peaks" aria-hidden="true"></span><span data-i18n="layers.peaks">פסגות</span>
          <input type="checkbox" class="switch" data-group="peaks" checked></label>
      </div>
      <div class="layer-row">
        <label><span class="sw sw-parking" aria-hidden="true"></span><span data-i18n="layers.parking">חניות</span>
          <input type="checkbox" class="switch" data-group="parking" checked></label>
      </div>
      <div class="layer-row">
        <label><span class="sw sw-drinking" aria-hidden="true"></span><span data-i18n="layers.drinking">מים לשתייה</span>
          <input type="checkbox" class="switch" data-group="drinking" checked></label>
      </div>
      <div class="layer-row">
        <label><span class="sw sw-camp" aria-hidden="true"></span><span data-i18n="layers.camp">חניוני לילה</span>
          <input type="checkbox" class="switch" data-group="camp" checked></label>
      </div>
      <div class="layer-row">
        <label><span class="sw sw-poi" aria-hidden="true"></span><span data-i18n="layers.poi">מעיינות, תצפיות ומחסות</span>
          <input type="checkbox" class="switch" data-group="poi" checked></label>
      </div>
      <div class="layer-row">
        <label><span class="sw sw-landcover" aria-hidden="true"></span><span data-i18n="layers.landcover">צמחייה</span>
          <input type="checkbox" class="switch" data-group="landcover" checked></label>
      </div>
    </section>


    <!-- Developer tools (Phase 0 tests). Shown only with ?dev=1; text stays in English on purpose. -->

</section>



<!-- Route dock (owner, D-049): a tool bar in the corner + a data panel (distance, name, colour, ascent/descent,
     max/min, elevation profile). Hiding the panel leaves the tool bar and a small pill with the key figures. -->
<div id="route-dock" class="route-dock" hidden>
  <div class="route-tools" role="toolbar" data-i18n-attr="aria-label:menu.route" aria-label="אפשרויות מסלול">
    <button id="r-save" class="tbtn" type="button" data-i18n-attr="title:lib.saveRoute;aria-label:lib.saveRoute"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4"/><path d="M8 20v-6h8v6"/></svg></button>
    <span class="tsep" aria-hidden="true"></span>
    <button id="plan" class="tbtn" type="button" data-i18n-attr="title:route.plan;aria-label:route.plan" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg></button>
    <button id="seg-toggle" class="tbtn" type="button" data-i18n-attr="title:route.modeSnap;aria-label:route.modeSnap" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 17c4-1 1-6 5-7 3-1 3-2 3-3"/></svg></button>
    <select id="seg-mode" hidden aria-hidden="true"><option value="snap" data-i18n="route.modeSnap">צמוד לשבילים</option><option value="free" data-i18n="route.modeFree">קו ישר</option></select>
    <span class="tsep" aria-hidden="true"></span>
    <button id="r-undo" class="tbtn" type="button" data-i18n-attr="title:route.undo;aria-label:route.undo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="r-redo" class="tbtn" type="button" data-i18n-attr="title:route.redo;aria-label:route.redo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button id="r-reverse" class="tbtn" type="button" data-i18n-attr="title:route.reverse;aria-label:route.reverse"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/></svg></button>
    <button id="r-loop" class="tbtn" type="button" data-i18n-attr="title:route.loop;aria-label:route.loop"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
    <button id="r-delete" class="tbtn" type="button" data-i18n-attr="title:route.deletePoint;aria-label:route.deletePoint"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <button id="r-clear" class="tbtn" type="button" data-i18n-attr="title:route.clear;aria-label:route.clear"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
  </div>
  <div id="profile-box" class="rd-panel">
    <div class="rd-data">
      <div class="rd-top">
        <div class="rd-dist" data-i18n-attr="title:stats.distance" title="מרחק"><b id="rd-dist">0</b><i data-i18n="unit.km">ק״מ</i></div>
        <div class="rd-name">
          <span id="route-name" class="rd-name-text" contenteditable="plaintext-only" spellcheck="false" data-i18n-attr="title:route.rename" title="שינוי שם"></span>
          <button id="route-color" class="color-dot" type="button" data-i18n-attr="title:route.color;aria-label:route.color" aria-label="צבע המסלול"></button>
          <span id="rd-saved" class="rd-saved" role="status" hidden></span>
        </div>
      </div>
      <div id="stats" class="rd-stats"></div>
      <div id="seg-errors"></div>
      <p class="hint" id="draw-hint" data-i18n="route.hint"></p>
      <p class="hint" id="snap-hint" hidden data-i18n="route.snapUnavailable"></p>
    </div>
    <div id="profile" class="rd-profile"></div>
    <div class="rd-side">
      <button id="profile-toggle" class="panel-btn hide-btn" type="button" data-i18n-attr="title:route.hideProfile;aria-label:route.hideProfile" aria-expanded="true" aria-controls="profile-box"><span data-i18n="route.hide">הסתר</span><svg class="chev" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <span class="rd-info" data-i18n-attr="title:safety" title="">ⓘ</span>
    </div>
  </div>
  <button id="route-pill" class="route-pill" type="button" hidden data-i18n-attr="title:route.showProfile" title="הצג">
    <span id="pill-stats"></span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
  </button>
  <div id="color-pop" class="color-pop" hidden role="listbox" data-i18n-attr="aria-label:route.color" aria-label="צבע המסלול"></div>
</div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
