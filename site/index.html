<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topo3D – מתכנן מסלולים</title>
<script>
  // Show any startup error on screen (owner sends a screenshot instead of opening DevTools).
  function showFatal(msg) {
    var d = document.getElementById('fatal') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'fatal' }));
    d.style.cssText = 'position:fixed;inset:auto 12px 12px 12px;z-index:9;background:#c62828;color:#fff;padding:10px 14px;border-radius:8px;font:13px/1.4 Consolas,monospace;direction:ltr;white-space:pre-wrap';
    d.textContent = (d.textContent ? d.textContent + '\n' : 'שגיאה / Error:\n') + msg;
  }
  addEventListener('error', function (e) { showFatal((e.message || 'script failed to load: ' + (e.target && (e.target.src || e.target.href))) ); }, true);
  addEventListener('unhandledrejection', function (e) { showFatal(String(e.reason && e.reason.message || e.reason)); });
</script>
<!-- Versions pinned to the official MapLibre RTL example (checked 2026-11-01). See DECISIONS D-008. -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" data-i18n-attr="aria-label:map.label" aria-label="מפה טופוגרפית תלת-ממדית"></div>

<div id="fps" class="chip" aria-live="off" hidden>– fps</div>

<!-- Floating toolbar (owner request D-029): "new route" always visible; layers and route menus open on click. -->
<div id="toolbar" class="toolbar">
  <button id="new-route" class="fab" type="button"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg><span data-i18n="route.new">מסלול חדש</span></button>
  <button id="btn-layers" class="tool-btn" type="button" aria-expanded="false" aria-controls="menu-layers" data-i18n-attr="aria-label:menu.layers;title:menu.layers" aria-label="שכבות"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3 2.5 8 12 13l9.5-5L12 3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m2.5 12 9.5 5 9.5-5M2.5 16l9.5 5 9.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
  <button id="btn-route" class="tool-btn" type="button" aria-expanded="false" aria-controls="menu-route" data-i18n-attr="aria-label:menu.route;title:menu.route" aria-label="אפשרויות מסלול"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="6" cy="18" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="6" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8.2 17.2c4-1.2 1.2-5.6 4.8-6.6 2.6-.7 3.4-1.8 3.6-2.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2.2 2.2"/></svg></button>
  <span id="plan-badge" class="plan-badge" hidden data-i18n="route.planning">עריכת מסלול</span>
</div>

<p id="status" class="status toast" role="status" aria-live="polite" hidden></p>

<section id="menu-layers" class="popover" hidden>
  <header class="popover-head"><strong data-i18n="menu.layers">שכבות</strong> <small class="build" title="build">__BUILD__</small></header>
    <section>
      <h2 data-i18n="bg.heading">רקע</h2>
      <div class="seg" role="radiogroup" data-i18n-attr="aria-label:bg.group" aria-label="רקע המפה">
        <label><input type="radio" name="base" value="topo" checked> <span data-i18n="bg.topo">טופוגרפי</span></label>
        <label><input type="radio" name="base" value="satellite"> <span data-i18n="bg.satellite">לוויין</span></label>
      </div>
      <div id="sat-opts" hidden>
        <label class="stack"><span data-i18n="bg.provider">מקור לוויין</span>
          <select id="sat-provider"></select>
        </label>
        <div id="sat-key-row" hidden>
          <label class="stack"><span data-i18n="bg.key">מפתח (נשמר רק בדפדפן הזה)</span>
            <input id="sat-key" type="password" autocomplete="off" spellcheck="false" dir="ltr">
          </label>
          <p class="hint" id="sat-key-help"></p>
          <button id="sat-key-save" class="btn" data-i18n="bg.keySave">שמור מפתח והצג</button>
        </div>
      </div>
    </section>

    <section>
      <h2 data-i18n="layers.heading">שכבות</h2>
      <label><input type="checkbox" data-group="terrain" checked> <span data-i18n="layers.terrain">תלת-ממד</span></label>
      <label><input type="checkbox" data-group="hillshade" checked> <span data-i18n="layers.hillshade">הצללה</span></label>
      <label><input type="checkbox" data-group="contours" checked> <span data-i18n="layers.contours">קווי גובה</span></label>
      <label><input type="checkbox" data-group="trails" checked> <span data-i18n="layers.trails">שבילים</span></label>
      <label><input type="checkbox" data-group="water" checked> <span data-i18n="layers.water">נחלים</span></label>
      <label><input type="checkbox" data-group="poi" checked> <span data-i18n="layers.poi">נקודות עניין</span></label>
      <label><input type="checkbox" data-group="landcover" checked> <span data-i18n="layers.landcover">צמחייה וכיסוי קרקע</span></label>
      <label class="slider"><span data-i18n="layers.exaggeration">הגבהה</span> <input id="exag" type="range" min="1" max="2" step="0.1" value="1.2"> <output id="exag-out">1.2</output></label>
    </section>

    <!-- Developer tools (Phase 0 tests). Shown only with ?dev=1; text stays in English on purpose. -->
    <section id="dev-section" hidden>
      <h2>Developer tests (?dev=1)</h2>
      <div class="row">
        <button id="t-encoding" class="btn">Encoding check</button>
        <button id="t-probe" class="btn">DEM max zoom</button>
        <button id="t-perf" class="btn">FPS test</button>
      </div>
      <div class="row">
        <button id="t-features" class="btn">Layer check</button>
        <button id="t-copy" class="btn">Copy results</button>
        <button id="t-style" class="btn">Export style</button>
      </div>
      <div id="test-out" class="test-out" aria-live="polite"></div>
    </section>
</section>

<section id="menu-route" class="popover" hidden>
    <section>
      <h2 data-i18n="route.heading">מסלול</h2>
      <div class="row">
        <button id="plan" class="btn btn-primary" aria-pressed="false" data-i18n="route.plan">תכנן מסלול</button>
        <label class="inline"><span data-i18n="route.mode">קטע חדש</span>
          <select id="seg-mode">
            <option value="snap" data-i18n="route.modeSnap">צמוד לשבילים</option>
            <option value="free" data-i18n="route.modeFree">קו ישר</option>
          </select>
        </label>
      </div>
      <div class="row">
        <button id="r-undo" class="btn" data-i18n="route.undo" title="Ctrl+Z">בטל</button>
        <button id="r-redo" class="btn" data-i18n="route.redo" title="Ctrl+Y">חזור</button>
        <button id="r-reverse" class="btn" data-i18n="route.reverse">הפוך כיוון</button>
        <button id="r-loop" class="btn" data-i18n="route.loop">סגור מעגל</button>
        <button id="r-delete" class="btn" data-i18n="route.deletePoint" title="Delete">מחק נקודה</button>
        <button id="r-clear" class="btn" data-i18n="route.clear">נקה מסלול</button>
      </div>
      <p class="hint" id="draw-hint" data-i18n="route.hint"></p>
      <p class="hint" id="snap-hint" hidden data-i18n="route.snapUnavailable"></p>
      <div id="seg-errors"></div>
      <label><input type="checkbox" id="show-profile" checked> <span data-i18n="route.showProfile">הצג גובה ופרופיל</span></label>
      <dl id="stats" class="stats"></dl>
    </section>
    <p class="safety" data-i18n="safety">מסלולים, גבהים וזמני הליכה הם הערכות ועלולים להיות שגויים. בדוק תמיד את השטח, מזג האוויר והמים לפני ובמהלך הטיול.</p>
</section>

<div id="profile-box" class="profile" hidden>
  <button id="profile-close" class="icon-btn profile-close" type="button" data-i18n-attr="aria-label:route.hideProfile;title:route.hideProfile" aria-label="הסתר פרופיל">✕</button>
  <div id="profile"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
