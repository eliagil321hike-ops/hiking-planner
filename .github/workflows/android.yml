# Android app (Capacitor) – A1, SPEC-WEB W10 (D-078). Does not touch the Pages deploy.
name: Android app
on:
  workflow_dispatch:
  push:
    branches: ["wip/a1"]
    paths: ["app/**", "site/**", "scripts/app_web.sh", ".github/workflows/android.yml"]
jobs:
  init:
    # One time: generate app/android with the Capacitor CLI (the agent's session cannot reach npm) and commit it
    # to this branch; afterwards it is edited in the repository like any other code.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Already generated?
        id: have
        run: if [ -d app/android ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v5
        if: steps.have.outputs.skip != '1'
        with:
          node-version: 22
      - name: Generate the Android project
        if: steps.have.outputs.skip != '1'
        run: |
          cd app
          npm install --no-audit --no-fund
          npm run web
          npx cap add android
          npx cap sync android
          npm ls --depth=0
      - name: Commit the generated project to this branch
        if: steps.have.outputs.skip != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/android app/package-lock.json
          git status --short | head -50
          git commit -m "A1: Android project generated by Capacitor CLI 8.6.0 (npx cap add android)"
          git push origin HEAD:${GITHUB_REF_NAME}
