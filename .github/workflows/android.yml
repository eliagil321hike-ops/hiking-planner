# Android app (Capacitor) – A1, SPEC-WEB W10 (D-078). Does not touch the Pages deploy.
name: Android app
on:
  workflow_dispatch:
  push:
    branches: ["wip/a1"]
    paths: ["app/**", "site/**", "scripts/app_web.sh", ".github/workflows/android.yml"]
jobs:
  init:
    # One time: generate app/android with the Capacitor CLI (this session cannot reach npm); it is then committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Already generated?
        id: have
        run: if [ -d app/android ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v5
        if: steps.have.outputs.skip != '1'
        with:
          node-version: 22
      - name: Generate the Android project
        if: steps.have.outputs.skip != '1'
        run: |
          cd app
          npm install --no-audit --no-fund
          npm run web
          npx cap add android
          npx cap sync android
          npm ls --depth=0
      - uses: actions/upload-artifact@v4
        if: steps.have.outputs.skip != '1'
        with:
          name: android-project
          path: |
            app/android
            app/package-lock.json
            !app/android/app/src/main/assets/public
            !app/android/.gradle
          include-hidden-files: true
