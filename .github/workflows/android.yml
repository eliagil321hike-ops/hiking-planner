# Android app (Capacitor) – A1, SPEC-WEB W10 (D-078). Does not touch the Pages deploy (pages.yml).
#  - main: after the Pages workflow (tests, then deploy) succeeds, build the APK from the same commit and keep it
#    as a downloadable artifact. Signed with the owner's release key when the GitHub Secrets exist
#    (TOPO3D_KEYSTORE_BASE64, TOPO3D_KEYSTORE_PASSWORD, TOPO3D_KEY_ALIAS, TOPO3D_KEY_PASSWORD); without them a
#    debug-signed test build is made and the run says so.
#  - wip/a1: the same build, then an Android emulator installs and opens it and checks it from inside
#    (scripts/apk_smoke.py); results are committed to docs/a1/ on the branch.
name: Android app
on:
  workflow_dispatch:
  push:
    branches: ["wip/a1"]
    paths: ["app/**", "site/**", "scripts/app_web.sh", "scripts/apk_smoke.py", ".github/workflows/android.yml"]
  workflow_run:
    workflows: ["Deploy site to GitHub Pages"]
    types: [completed]
    branches: [main]
jobs:
  init:
    # One time: generate app/android with the Capacitor CLI (the agent's session cannot reach npm) and commit it
    # to this branch; afterwards it is edited in the repository like any other code.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Already generated?
        id: have
        run: if [ -d app/android ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v5
        if: steps.have.outputs.skip != '1'
        with:
          node-version: 22
      - name: Generate the Android project
        if: steps.have.outputs.skip != '1'
        run: |
          cd app
          npm install --no-audit --no-fund
          npm run web
          npx cap add android
          npx cap sync android
          npm ls --depth=0
      - name: Commit the generated project to this branch
        if: steps.have.outputs.skip != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/android app/package-lock.json
          git commit -m "A1: Android project generated by Capacitor CLI 8.6.0 (npx cap add android)"
          git push origin HEAD:${GITHUB_REF_NAME}

  build:
    needs: init
    if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.apk.outputs.kind }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web content (site/ → app/www, stamped) and Capacitor sync
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          cd app
          npm ci --no-audit --no-fund
          bash ../scripts/app_web.sh "$SHA"
          npx cap sync android
      - name: Release key from GitHub Secrets (temporary file, deleted after the build)
        env:
          KS_B64: ${{ secrets.TOPO3D_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TOPO3D_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key in GitHub Secrets yet – building a DEBUG-signed test APK (README 'Android app' step 1–2)."
          fi
      - name: Build the APK
        id: apk
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          TOPO3D_KEYSTORE_PASSWORD: ${{ secrets.TOPO3D_KEYSTORE_PASSWORD }}
          TOPO3D_KEY_ALIAS: ${{ secrets.TOPO3D_KEY_ALIAS }}
          TOPO3D_KEY_PASSWORD: ${{ secrets.TOPO3D_KEY_PASSWORD }}
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          cd app/android
          chmod +x gradlew
          if [ -n "${TOPO3D_KEYSTORE:-}" ]; then
            ./gradlew --no-daemon assembleRelease
            SRC=app/build/outputs/apk/release/app-release.apk; KIND=release
          else
            ./gradlew --no-daemon assembleDebug
            SRC=app/build/outputs/apk/debug/app-debug.apk; KIND=debug
          fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          OUT="$GITHUB_WORKSPACE/out/topo3d-${KIND}-${SHA}-v${APP_VERSION_CODE}.apk"
          cp "$SRC" "$OUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          # signing certificate (its SHA-1/SHA-256 are needed later to register the app in Firebase, A2)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$OUT" || echo "::warning::apksigner could not verify"
          ls -l "$OUT"; sha256sum "$OUT"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: topo3d-apk
          path: out/*.apk
          retention-days: 30

  emulator:
    # Only on the work branch: install and open the APK on an emulator and check it from inside.
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: topo3d-apk
          path: out
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: pip install --quiet websocket-client
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 scripts/apk_smoke.py out/*.apk docs/a1
      - name: Keep the results on the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin ${GITHUB_REF_NAME} || true
          git add docs/a1 || true
          git commit -m "A1: emulator check of the APK (run ${{ github.run_number }})" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
