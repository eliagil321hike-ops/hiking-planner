# Firestore security rules tests on the Firebase emulator (accounts, SPEC-WEB W9). Does not deploy anything.
# Runs on any branch that changes the rules or their tests.
name: Firestore rules tests
on:
  push:
    paths: ["firebase/**", ".github/workflows/rules.yml"]
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4          # the Firestore emulator is a Java program
        with:
          distribution: temurin
          java-version: 21
      - name: Install the emulator and test library
        run: |
          cd firebase
          npm install --no-audit --no-fund      # exact versions pinned in firebase/package.json
          npm ls --depth=0
      - name: Rules tests (emulator)
        run: cd firebase && npx firebase --version && npm test
