# Firestore security rules tests on the Firebase emulator (accounts, SPEC-WEB W9). Does not deploy anything.
# Runs on any branch that changes the rules or their tests.
name: Firestore rules tests
on:
  push:
    paths: ["firebase/**", ".github/workflows/rules.yml"]
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4          # the Firestore emulator is a Java program
        with:
          distribution: temurin
          java-version: 21
      - name: Install the emulator and test library
        run: |
          cd firebase
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund
          else npm install --no-audit --no-fund --save-dev firebase-tools@15.34.1 @firebase/rules-unit-testing firebase; fi
          npm ls --depth=0
      - name: Rules tests (emulator)
        run: cd firebase && npx firebase --version && npm test
      - name: Keep the resolved versions (to pin them in the repo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-lock
          path: |
            firebase/package.json
            firebase/package-lock.json
