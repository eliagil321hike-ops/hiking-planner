# Deploys the ./site folder to GitHub Pages on every push to main.
# Action versions from the GitHub Docs example "Using custom workflows with GitHub Pages" (checked 2026-11-01).
# One-time repo setting: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy site to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"   # weekly redeploy: refreshes the OSM trails/campsites/water extract (D-032)
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5   # tag v5 exists (mirror of actions/setup-node, checked 2026-11-01)
        with:
          node-version: 22             # 22.18+ runs .ts tests natively (type stripping)
      - name: Unit tests (geo package, no dependencies)
        run: cd packages/geo && node --test "test/**/*.test.ts"
      - name: Unit tests (route editor, no dependencies)
        run: cd packages/editor && node --test "test/**/*.test.ts"
      - name: Unit tests (routing provider, fake server)
        run: node --test "tests/*.test.mjs"
      - name: Browser tests (headless Chromium; real MapLibre build for e2e)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet playwright pillow
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python scripts/browser_smoke_test.py
          .venv/bin/python scripts/e2e_test.py
  deploy:
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: OSM sources - Geofabrik files filtered by osmium (D-057, regions D-058)
        run: |
          # Fresh data on the weekly schedule / manual runs, and on a push whose extract rules changed (the live
          # index has another extract_version); other pushes reuse the live files (D-041). The border outlines
          # are always fetched: the site's coverage follows them.
          WANT=$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import fetch_osm_hiking as f; print(f.EXTRACT_VERSION)')
          LIVE=$(curl -fsS -m 30 "https://eliagil321hike-ops.github.io/hiking-planner/data/osm/index.json" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("extract_version"))' 2>/dev/null || echo none)
          FRESH=1; [ "${{ github.event_name }}" = "push" ] && [ "$LIVE" = "$WANT" ] && FRESH=0
          echo "extract version: live $LIVE, wanted $WANT → fresh=$FRESH"
          echo "OSM_FRESH=$FRESH" >> "$GITHUB_ENV"
          for r in israel georgia norway; do
            if [ "$FRESH" = 1 ]; then ARGS=$(bash scripts/osm_source_geofabrik.sh "$RUNNER_TEMP/osm" "$r" | tail -1)
            else ARGS=""; bash scripts/osm_source_geofabrik.sh "$RUNNER_TEMP/osm" "$r" --poly-only >/dev/null; fi
            echo "OSM_ARGS_$r=$ARGS" >> "$GITHUB_ENV"
          done
      - name: OSM extract (Israel, Georgia, Norway; trails, campsites, water, waterfalls, pools, ruins …)
        run: |
          # previous live files = fallback when a source fails or answers only partly (D-035)
          mkdir -p prev
          for f in osm-trails osm-pois; do for sfx in "" -georgia -norway; do
            curl -fsS -m 60 -o "prev/$f$sfx.geojson" "https://eliagil321hike-ops.github.io/hiking-planner/data/$f$sfx.geojson" || echo "no previous $f$sfx"
          done; done
          REUSE=""; [ "$OSM_FRESH" = 0 ] && REUSE="--reuse-same-version"
          for r in israel georgia norway; do
            V="OSM_ARGS_$r"   # "--opl … --osm-base …" when the Geofabrik step worked; empty → fallback
            python3 scripts/fetch_osm_hiking.py site/data --region "$r" --soft --previous prev --no-split $REUSE ${!V}
          done
          python3 scripts/fetch_osm_hiking.py site/data --split-only --poly-dir "$RUNNER_TEMP/osm"
          du -sh site/data site
      - name: Stamp build (cache busting, version shown in the page)
        run: bash scripts/stamp_build.sh site "${GITHUB_SHA::7}"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
