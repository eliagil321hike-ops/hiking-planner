# Deploys the ./site folder to GitHub Pages on every push to main.
# Action versions from the GitHub Docs example "Using custom workflows with GitHub Pages" (checked 2026-11-01).
# One-time repo setting: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy site to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"   # weekly redeploy: refreshes the OSM trails/campsites/water extract (D-032)
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5   # tag v5 exists (mirror of actions/setup-node, checked 2026-11-01)
        with:
          node-version: 22             # 22.18+ runs .ts tests natively (type stripping)
      - name: Unit tests (geo package, no dependencies)
        run: cd packages/geo && node --test "test/**/*.test.ts"
      - name: Unit tests (route editor, no dependencies)
        run: cd packages/editor && node --test "test/**/*.test.ts"
      - name: Unit tests (routing provider, fake server)
        run: node --test "tests/*.test.mjs"
      - name: Browser tests (headless Chromium; real MapLibre build for e2e)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet playwright pillow
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python scripts/browser_smoke_test.py
          .venv/bin/python scripts/e2e_test.py
  deploy:
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: OSM source - Geofabrik Israel file filtered by osmium (D-057; empty = fall back to Overpass)
        if: github.event_name != 'push'   # pushes reuse the live extract (D-041) and need no source
        run: |
          ARGS=$(bash scripts/osm_source_geofabrik.sh "$RUNNER_TEMP/osm" | tail -1)
          echo "OSM_SOURCE_ARGS=$ARGS" >> "$GITHUB_ENV"
      - name: OSM extract for Israel (national/regional/marked trails, campsites, water)
        run: |
          # previous live files = fallback when Overpass fails or answers only partly (D-035)
          mkdir -p prev
          for f in osm-trails.geojson osm-pois.geojson; do
            curl -fsS -m 60 -o "prev/$f" "https://eliagil321hike-ops.github.io/hiking-planner/data/$f" || echo "no previous $f"
          done
          # Fresh Overpass extract only on the weekly schedule / manual run, or when the live files are missing or
          # from another extract version; ordinary pushes reuse them: deploy in minutes, no Overpass load (D-041).
          REUSE=""; [ "${{ github.event_name }}" = "push" ] && REUSE="--reuse-same-version"
          # OSM_SOURCE_ARGS: "--opl … --osm-base …" when the Geofabrik step worked; empty → Overpass as before
          python3 scripts/fetch_osm_hiking.py site/data --soft --previous prev $REUSE ${OSM_SOURCE_ARGS:-}
      - name: Stamp build (cache busting, version shown in the page)
        run: bash scripts/stamp_build.sh site "${GITHUB_SHA::7}"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
