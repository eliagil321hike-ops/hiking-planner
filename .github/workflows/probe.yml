# One-off data build (D-032). Runs only on probe/* branches; deleted after use.
name: probe
on:
  push:
    branches: ["probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: cd probe && node routes.mjs
      - uses: actions/upload-artifact@v4
        with: { name: trails, path: probe/out/trails.geojson }
