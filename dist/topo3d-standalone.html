<script>
  // Show any startup error on screen (owner sends a screenshot instead of opening DevTools).
  function showFatal(msg) {
    var d = document.getElementById('fatal') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'fatal' }));
    d.style.cssText = 'position:fixed;inset:auto 12px 12px 12px;z-index:9;background:#c62828;color:#fff;padding:10px 14px;border-radius:8px;font:13px/1.4 Consolas,monospace;direction:ltr;white-space:pre-wrap';
    d.textContent = (d.textContent ? d.textContent + '\n' : 'שגיאה / Error:\n') + msg;
  }
  addEventListener('error', function (e) { showFatal((e.message || 'script failed to load: ' + (e.target && (e.target.src || e.target.href))) ); }, true);
  addEventListener('unhandledrejection', function (e) { showFatal(String(e.reason && e.reason.message || e.reason)); });
</script>

<style>
:root {
  --bg: #fbfaf7;
  --fg: #2a241d;
  --muted: #6b6257;
  --line: #e2ddd4;
  --accent: #b5502a;
  --accent-fg: #ffffff;
  --ok: #2e7d32;
  --bad: #c62828;
  --panel-shadow: 0 6px 24px rgba(40, 30, 20, 0.18);
  --font: system-ui, "Segoe UI", "Noto Sans Hebrew", Arial, sans-serif;
}
:root:not([data-theme="light"]) { color-scheme: light; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); }
#map { position: fixed; inset: 0; }

.panel {
  position: fixed; top: 12px; inset-inline-end: 12px; width: min(340px, calc(100vw - 24px));
  max-height: calc(100vh - 24px); overflow: auto; background: var(--bg); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--panel-shadow); z-index: 2;
}
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
.panel.collapsed .panel-body { display: none; }
.panel-body { padding: 4px 12px 12px; }
.panel h2 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); font-weight: 600; }
.panel label { display: flex; gap: 8px; align-items: center; min-height: 32px; cursor: pointer; }
.panel input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.slider input { flex: 1; accent-color: var(--accent); }

.row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.btn {
  min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line);
  background: #fff; color: var(--fg); font: inherit; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: progress; }
.icon-btn { min-width: 40px; min-height: 40px; border: 0; background: transparent; font-size: 18px; cursor: pointer; color: var(--fg); }

.hint, .safety { color: var(--muted); font-size: 12px; margin: 4px 0; }
.safety { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 8px; }

.stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0 0; font-variant-numeric: tabular-nums; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; font-weight: 600; }

.test-out { font-size: 12px; white-space: pre-wrap; direction: ltr; text-align: left; font-family: ui-monospace, Consolas, monospace; max-height: 260px; overflow: auto; }
.test-out .pass { color: var(--ok); font-weight: 700; }
.test-out .fail { color: var(--bad); font-weight: 700; }

.chip { position: fixed; top: 12px; inset-inline-start: 56px; z-index: 2; background: rgba(255,255,255,0.9); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font: 600 12px var(--font); direction: ltr; }

.profile {
  position: fixed; inset-inline: 12px; bottom: 34px; height: 170px; z-index: 2; background: rgba(251,250,247,0.96);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--panel-shadow); padding: 4px; direction: ltr;
}
.profile-area { fill: rgba(42, 36, 29, 0.78); }
.profile-seg { stroke-width: 3; stroke-linecap: round; }
.profile-grid { stroke: var(--line); stroke-width: 1; }
.profile-dot { fill: var(--fg); stroke: #fff; stroke-width: 1.5; }
.profile-strong { font-weight: 700; fill: var(--fg); }
.profile-axis { font: 11px var(--font); fill: var(--muted); paint-order: stroke; stroke: rgba(251,250,247,0.85); stroke-width: 3px; }
.profile-cursor { stroke: var(--fg); stroke-width: 1; stroke-dasharray: 3 3; }

.maplibregl-ctrl-attrib { font-size: 11px; }

@media (max-width: 600px) {
  .panel { top: auto; bottom: 12px; max-height: 55vh; }
  .profile { bottom: auto; top: 56px; height: 120px; }
}

</style>

<body>
<div id="map" aria-label="מפה טופוגרפית תלת-ממדית"></div>

<div id="fps" class="chip" aria-live="off">– fps</div>

<aside id="panel" class="panel">
  <header class="panel-head">
    <strong>Topo3D · מתכנן מסלולים</strong>
    <button id="panel-toggle" class="icon-btn" aria-expanded="true" aria-label="הסתר/הצג לוח">☰</button>
  </header>
  <div class="panel-body">
    <section>
      <h2>שכבות</h2>
      <label><input type="checkbox" data-group="terrain" checked> תלת-ממד</label>
      <label><input type="checkbox" data-group="hillshade" checked> הצללה</label>
      <label><input type="checkbox" data-group="contours" checked> קווי גובה</label>
      <label><input type="checkbox" data-group="trails" checked> שבילים</label>
      <label><input type="checkbox" data-group="landcover" checked> צמחייה וכיסוי קרקע</label>
      <label class="slider">הגבהה <input id="exag" type="range" min="1" max="2" step="0.1" value="1.2"> <output id="exag-out">1.2</output></label>
    </section>

    <section>
      <h2>קו ופרופיל</h2>
      <div class="row">
        <button id="draw" class="btn" aria-pressed="false">צייר קו</button>
        <button id="undo-pt" class="btn">בטל נקודה</button>
        <button id="clear" class="btn">נקה</button>
      </div>
      <p class="hint" id="draw-hint">לחץ "צייר קו" ואז הקש על המפה להוספת נקודות.</p>
      <dl id="stats" class="stats"></dl>
    </section>

    <section>
      <h2>בדיקות (שלב 0)</h2>
      <div class="row">
        <button id="t-encoding" class="btn">בדיקת קידוד</button>
        <button id="t-probe" class="btn">זום DEM מקסימלי</button>
        <button id="t-perf" class="btn">בדיקת FPS</button>
      </div>
      <div class="row">
        <button id="t-features" class="btn">בדיקת שכבות</button>
        <button id="t-copy" class="btn">העתק תוצאות</button>
        <button id="t-style" class="btn">ייצוא סגנון</button>
      </div>
      <div id="test-out" class="test-out" aria-live="polite"></div>
    </section>

    <p class="safety">מסלולים, גבהים וזמני הליכה הם הערכות ועלולים להיות שגויים. בדוק תמיד את השטח, מזג האוויר והמים לפני ובמהלך הטיול.</p>
  </div>
</aside>

<div id="profile" class="profile" hidden></div>

<script type="module">import "topo3d:app.js";</script>
</body>
</html>
